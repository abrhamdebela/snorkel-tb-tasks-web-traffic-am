name: Test Tasks with Multiple Agents

on:
  pull_request:
    paths:
      - "tasks/**"
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  find-modified-tasks:
    runs-on: ubuntu-latest
    name: Find modified test tasks

    outputs:
      tasks: ${{ steps.find-modified.outputs.tasks }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: tasks/**/*
      - name: Find modified test tasks
        id: find-modified
        run: |
          # Get all modified task directories
          ALL_TASKS=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '^tasks/[^/]+/' | cut -d'/' -f2 | sort | uniq)

          # Filter out tasks where only instruction changed
          TASKS=""

          # Make the check script executable
          chmod +x scripts_bash/check-instruction-only-change.sh

          for task in $ALL_TASKS; do
            
            # Check if only instruction changed
            if ./scripts_bash/check-instruction-only-change.sh "tasks/$task" "${{ github.base_ref }}"; then
              echo "⏭️  Skipping $task (only instruction field changed)"
            else
              TASKS="$TASKS $task"
            fi
          done

          # Clean up the task list
          TASKS=$(echo "$TASKS" | tr ' ' '\n' | grep -v '^$' | tr '\n' ' ' | sed 's/^ *//' | sed 's/ $//')

          echo "Modified tasks to test: $TASKS"
          
          # Convert space-separated list to JSON array (compact format)
          TASKS_ARRAY=$(echo "$TASKS" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          echo "tasks=$TASKS_ARRAY" >> $GITHUB_OUTPUT
  
  check-leaking-files:
    runs-on: ubuntu-latest
    needs: find-modified-tasks
    strategy:
      matrix:
        task: ${{ fromJSON(needs.find-modified-tasks.outputs.tasks) }}
    name: Check leaking files of ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check leaking files
        run: |
          docker build -t leaking-files-test "tasks/${{ matrix.task }}"
          FORBIDDEN_FILES=("./solution.yaml" "./solution.sh" "./run-tests.sh" "./test_outputs.py")
          for file in ${FORBIDDEN_FILES[@]}; do
            if docker run --rm leaking-files-test test -f "$file"; then
              echo "❌ Error: $file is leaking"
              exit 1
            fi
          done
          echo "✅ No leaking files found"
          exit 0

  quality-by-llm:
    needs: find-modified-tasks
    strategy:
      matrix:
        task: ${{ fromJSON(needs.find-modified-tasks.outputs.tasks) }}
    name: Check quality of ${{ matrix.task }} by LLM
    uses: ./.github/workflows/check-quality-by-llm.yaml
    with:
      task: ${{ matrix.task }}
    secrets: inherit

  test-agents:
    needs: find-modified-tasks
    strategy:
      fail-fast: false
      matrix:
        agent:
          - name: "codex"
            display: "Codex (GPT-5)"
            model: "openai/gpt-5"
            required: false
            key: "codex-gpt5"
          - name: "claude-code"
            display: "Claude-Code (Claude 4.5 Sonnet)"
            model: "anthropic/claude-sonnet-4-5-20250929"
            required: false
            key: "claude-code-4-5-sonnet"
        run: [1, 2, 3, 4, 5]
        task: ${{ fromJSON(needs.find-modified-tasks.outputs.tasks) }}
    name: Test Agents with ${{ matrix.agent.display }} - ${{ matrix.task }} - ${{ matrix.run }}
    uses: ./.github/workflows/test-single-task.yaml
    with:
      agent: ${{ matrix.agent.name }}
      run: ${{ matrix.run }}
      key: ${{ matrix.agent.key }}
      model: ${{ matrix.agent.model }}
      required: ${{ matrix.agent.required }}
      task: ${{ matrix.task }}
    secrets: inherit

  test-non-agents:
    needs: find-modified-tasks
    strategy:
      fail-fast: false
      matrix:
        agent:
          - name: "oracle"
            display: "Oracle Solution"
            required: true
            key: "oracle"
          - name: "nop"
            display: "NOP Agent (Should Fail)"
            required: true
            key: "nop"
        run: [1]
        task: ${{ fromJSON(needs.find-modified-tasks.outputs.tasks) }}
    name: Test Non-Agents with ${{ matrix.agent.display }} - ${{ matrix.task }} - ${{ matrix.run }}
    uses: ./.github/workflows/test-single-task.yaml
    with:
      agent: ${{ matrix.agent.name }}
      run: ${{ matrix.run }}
      key: ${{ matrix.agent.key }}
      model: ${{ matrix.agent.model }}
      required: ${{ matrix.agent.required }}
      task: ${{ matrix.task }}

  # Summary job to provide clear PR status
  test-summary:
    runs-on: ubuntu-latest
    needs: [test-agents, test-non-agents]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/results
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install numpy
      - name: Run a Python script
        run: python scripts_python/summarize_runs.py
        id: summarize_runs
      - name: Add comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: "summary-of-runs-comment.md"
      - name: Set difficulty output as a label
        run: |
          # Get existing labels
          EXISTING_LABELS=$(gh pr view "$NUMBER" --json labels --jq '.labels[].name')

          # Check if the new label already exists
          if echo "$EXISTING_LABELS" | grep -q "^${LABEL}$"; then
            echo "Label '$LABEL' already exists, no change needed"
          else
            # Remove any existing difficulty labels
            for difficulty in "difficulty:hard" "difficulty:medium" "difficulty:easy" "difficulty:trivial"; do
              if echo "$EXISTING_LABELS" | grep -q "^${difficulty}$"; then
                echo "Removing old label: $difficulty"
                gh pr edit "$NUMBER" --remove-label "$difficulty" || true
              fi
            done

            # Add the new label
            echo "Adding new label: $LABEL"
            gh pr edit "$NUMBER" --add-label "$LABEL"
          fi
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.summarize_runs.outputs.difficulty }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}