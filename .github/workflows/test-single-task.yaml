name: Test Single Task

on:
  workflow_call:
    inputs:
      agent:
        type: string
        description: The agent to test
      run:
        type: string
        description: The run to test
      key:
        type: string
        description: The key to use for the run
      model:
        type: string
        description: The model to test
      required:
        type: boolean
        description: Whether the agent is required
        default: true
      task:
        type: string
        description: The task to test

jobs:
  test-single-task:
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.required }}
    name: Test with ${{ inputs.agent }} - ${{ inputs.run }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          # Install uv
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

          # Install terminal-bench
          uv tool install terminal-bench

          # Install jq and bc for parsing results
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Run tests for modified tasks
        id: run-tests
        run: |
          # Make the script executable
          chmod +x scripts_bash/test-modified-tasks.sh

          # Build the command with agent and model parameters
          CMD="./scripts_bash/test-modified-tasks.sh --agent ${{ inputs.agent }} --run ${{ inputs.run }} --key ${{ inputs.key }}"
          if [ -n "${{ inputs.model }}" ]; then
            CMD="$CMD --model ${{ inputs.model }}"
          fi
          if [ "${{ inputs.required }}" != "true" ]; then
            CMD="$CMD --no-fail-on-error"
          fi
          CMD="$CMD ${{ inputs.task }}"

          # Run the script and capture result
          mkdir -p /tmp/test-results

          # Run the command (it will write result to runs/github-action-$task-$RUN/results.json)
          $CMD

      - name: Print agent logs
        run: |
          # Find the tests.log file
          log_file=$(find runs/github-action-${{ inputs.key }}_${{ inputs.task }}_${{ inputs.run }} -name "agent.log")
          # Cat the agent.log file
          cat $log_file

      - name: Print tests logs
        run: |
          # Find the tests.log file
          log_file=$(find runs/github-action-${{ inputs.key }}_${{ inputs.task }}_${{ inputs.run }} -name "tests.log")
          # Cat the tests.log file
          cat $log_file

      - name: Debug an agent run if failure
        run: |
          # Note that this step runs only for agent failure because non-agent failure comes with required=true and steps will be skipped unless if: always().
          result=$(cat /tmp/agent_test_result.txt)
          echo "Test result: $result"
          if [ "$result" = "failure" ]; then
            uv run tb tasks debug --run-id github-action-${{ inputs.key }}_${{ inputs.task }}_${{ inputs.run }} ${{ inputs.task }}
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ inputs.key }}_${{ inputs.task }}_${{ inputs.run }}
          path: runs/github-action-${{ inputs.key }}_${{ inputs.task }}_${{ inputs.run }}/results.json
          retention-days: 1

      - name: Upload session recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ inputs.key }}_${{ inputs.task }}_${{ inputs.run }}
          path: runs/**/sessions/*
          retention-days: 1