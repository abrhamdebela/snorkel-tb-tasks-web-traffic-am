name: Check PR Files

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-files:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        
      - name: Check if changes are under tasks directory
        run: |
          echo "Checking if all changes are under tasks/ directory..."
          
          invalid_files=()
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ ! "$file" =~ ^tasks/ ]]; then
              invalid_files+=("$file")
            fi
          done
          
          if [ ${#invalid_files[@]} -ne 0 ]; then
            echo "❌ Error: The following files are not under the tasks/ directory:"
            printf '%s\n' "${invalid_files[@]}"
            echo ""
            echo "All changes in this PR must be under the tasks/ directory."
            echo "Please move your changes to tasks/your-task-name/"
            exit 1
          fi
          
          echo "✅ All changes are under the tasks/ directory."
          
      - name: Check if changes are in a single task folder
        run: |
          echo "Checking if all changes are in a single folder under tasks/..."
          
          task_folders=()
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Extract the task folder name (first directory after tasks/)
            if [[ "$file" =~ ^tasks/([^/]+) ]]; then
              task_folder="${BASH_REMATCH[1]}"
              # Add to array if not already present
              if [[ ! " ${task_folders[@]} " =~ " ${task_folder} " ]]; then
                task_folders+=("$task_folder")
              fi
            fi
          done
          
          if [ ${#task_folders[@]} -gt 1 ]; then
            echo "❌ Error: Changes span multiple task folders:"
            printf '  - tasks/%s\n' "${task_folders[@]}"
            echo ""
            echo "All changes in a PR must be within a single task folder."
            echo "Please create separate PRs for each task."
            exit 1
          fi
          
          if [ ${#task_folders[@]} -eq 1 ]; then
            echo "✅ All changes are in a single task folder: tasks/${task_folders[0]}"
          fi
          
      - name: List changed files
        run: |
          echo "Changed files in this PR:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

