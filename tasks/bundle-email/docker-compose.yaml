# Hint from Snorkel
# Configuration file that defines how containers, volumes, and networks are orchestrated for the task.
# It should reference the base image from the Dockerfile and include any necessary environment variables or mounted resources.

services:
  client:
    build:
      dockerfile: Dockerfile
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME}
    command: [ "sh", "-c", "sleep infinity" ]
    environment:
      - TEST_DIR=/tests
      - T_BENCH_CONTAINER_LOGS_PATH=/tmp
      - T_BENCH_CONTAINER_AGENT_LOGS_PATH=/tmp
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH}:${T_BENCH_CONTAINER_LOGS_PATH}
      - ${T_BENCH_TASK_AGENT_LOGS_PATH}:${T_BENCH_CONTAINER_AGENT_LOGS_PATH}
