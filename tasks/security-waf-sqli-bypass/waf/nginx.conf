worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Rate limiting zone - 300 requests per minute with burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;

    server {
        listen 80;

        location /user {
            # Apply rate limiting with larger burst
            limit_req zone=api_limit burst=50 nodelay;

            # Run WAF rules
            access_by_lua_file /usr/local/openresty/nginx/conf/waf.lua;

            # Proxy to webapp (using docker compose service name)
            proxy_pass http://webapp:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
