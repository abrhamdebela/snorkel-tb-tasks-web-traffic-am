# Sample kubeconfig template for exploit-user
# This would be populated with actual cluster credentials in a real scenario

apiVersion: v1
kind: Config
clusters:
- cluster:
    certificate-authority-data: LS0tLS1CRUdJTi...  # Base64 encoded CA cert
    server: https://127.0.0.1:6443
  name: k8s-security-lab
contexts:
- context:
    cluster: k8s-security-lab
    namespace: vulnerable-app
    user: exploit-user
  name: exploit-user-context
current-context: exploit-user-context
users:
- name: exploit-user
  user:
    token: eyJhbGciOiJSUzI1NiIsImtpZCI6...  # Service account token
