instruction: |
  You are diagnosing intermittent system failures in a distributed web service. Three log files from different components of the system are located in /app/logs/.
  Your job is to analyze these logs and produce structured error summaries.
  
  Your task:
  1. parse all three log files (/app/logs/*.log)
  2. extract ERROR and CRITICAL level messages
  3. find correlations: errors that occur within 5 seconds of each other
  4. identify the most frequent error patterns
  5. generate a summary report
  
  Output requirements:
  - /app/error_summary.json with:
    - total_errors: count of all errors
    - critical_errors: count of critical errors
    - correlated_groups: list of error groups that occurred together
    - top_patterns: top 3 most frequent error types
  - /app/timeline.txt with chronological error timeline
  
  Note: Timestamps are in format "YYYY-MM-DD HH:MM:SS"
  - The variable name must be "time_range" (not "timestamp_range")
  - Inside sources, log file names should be included without the .log extension
  Errors are correlated if they occur within 5 seconds across different logs.

